<!DOCTYPE html>
<html>

<me>
	<title>照片墙</title>

	<meta charset="UTF-8">
	<meta name="Author" content="只会切图的前端">
	<meta name="referrer" content="no-referrer">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

	</head>

	<body>
		<div id="container"></div>
		<audio autoplay loop controls id="music">
			<source src="img/love.mp3">
		</audio>

		<script src="js/three.min.js"></script>
		<!-- 补间动画 -->
		<script src="js/tween.min.js"></script>
		<!-- 轨迹球控制器（TrackballControls） -->
		<script src="js/TrackballControls.js"></script>

		<script src="js/CSS3DRenderer.js"></script>


		<script>
			let musicDom = document.getElementById("music");
			let isMusicStarted = false;
			let picArr = [];
			function startMusic() {
				if (isMusicStarted) return;
				isMusicStarted = true;

				musicDom.play().then(() => {
					console.log("音乐开始播放");
				}).catch(error => {
					console.error("播放失败:", error);
				});

				// 移除监听器
				document.removeEventListener('click', startMusic);
				document.removeEventListener('touchend', startMusic);
			}

			// 绑定事件
			document.addEventListener('click', startMusic);
			document.addEventListener('touchend', startMusic);
			let arr = [
				'428A1C1_427A_01_20260721172622192newMediaImage.jpg',
				'5BAE20F_427A_02_20260721172749913newMediaImage.jpg',
				'52334D5_427A_03_20260721172954208newMediaImage.jpg',
				'10E2614_427A_04_20260721173009921newMediaImage.jpg',
				'4F784B9_427A_05_20260721173306660newMediaImage.jpg',
				'52C848F_427A_06_20260721173215054newMediaImage.jpg',
				'DBFAEE_427A_07_20260721173438185newMediaImage.jpg',
				'264C8D1_427A_08_20260721173454410newMediaImage.jpg',
				'4B547C5_427A_09_20260721173635626newMediaImage.jpg',
				'3104411_427A_10_20260721173654043newMediaImage.jpg',
				'1002CFC_427A_11_20260721174418101newMediaImage.jpg',
				'2784855_427A_12_20260721174431205newMediaImage.JPG',
				'2EE4865_427A_13_20260721174600841newMediaImage.JPG',
				'5CB5F60_427A_14_20260721174624814newMediaImage.JPG',
				'1752130_427A_15_20260721175225995newMediaImage.JPG',
				'52A8BC7_427A_16_20260721175233359newMediaImage.JPG',
				'4084189_427A_17_20260721175540878newMediaImage.JPG',
				'13F2A50_427A_18_20260721180021421newMediaImage.JPG',
				'29E0F66_427A_19_20260721180357202newMediaImage.JPG',
				'2328ED2_427A_20_20260721193920075newMediaImage.jpg',
				'351EFE8_427A_21_20260721193921846newMediaImage.jpg',
				'32855B0_427A_22_20260721193951668newMediaImage.JPG',
				'A78DD9_427A_23_20260721193954660newMediaImage.JPG',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzI3NzU5NV81NDQzNjNiOS01Yjc4LTQ2NjAtYjk5Zi0wOWU5OTQ2M2UzMDQ=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzMwOTYwNF9mMGU3NzM5NC1lNDdiLTQwNGQtODYyNC03Mjg3YjdjNDFjMjU=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzMzMjIwNF8zNzc4ZmRlOC0zNDk4LTQxNzYtYWI2OC03ZWE5NDM2ZjkxMzE=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzM1NTc5OF8xZGE3ZjE0NS1kOGY1LTRhZjktOTJjNS04Y2Q3MDU0MzNiMDc=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzM3NzMzM19jZjYyZmQ5Mi1kZGFjLTQ4MTgtYWM5YS05OTQ3ZDI5NTk3Yzc=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzM5Nzg2M18zMjEyNjc4NS04M2Q0LTRmMDgtOGY2OC04ZGYwODc3NTk3MjY=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzQzMjgxOF9mOGFjNzBmZi03NGJkLTQ3NGEtOGNmYS1lNGI5NGMwMTc3NWY=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzQ1NjEwMV81YjMxNjFlOS1mOTA0LTQwZTgtYWQzMC02NjU1MGI0MDVhNzc=',
				//   '/bmltYV8yNzk5NTAxMTYwMTdfMTczNTU0MzQ3MzczMV9lNjcyMWU3YS0wNTAxLTQ3YWItOWMwYS02NGU4MjIwODQxYzg='
			]

			// 生成随机图片
			for (let i = 0; i < 199; i++) {
				let yu = i % 18;
				// if (yu == 0) {
				// 	yu = 17;
				// }
				picArr.push({
					url: "https://storage.7x24cc.com/storage-server/presigned/ss1/a6-online-fileupload/newMediaImage/" + arr[yu]
				});
			}
			console.log(picArr, 'picArr');

			let table = [];
			for (let i = 0; i < picArr.length; i++) {
				table[i] = {};
				if (i < picArr.length) {
					table[i] = picArr[i];
				}
				table[i].p_x = i % 20 + 1;
				table[i].p_y = Math.floor(i / 20) + 1;
			}

			//场景（scene）、相机（camera）和渲染器（renderer），这样我们就能透过摄像机渲染出场景
			let camera, scene, renderer;
			let controls;
			let objects = [];
			let targets = [];

			init();
			animate();


			function init() {
				//透视相机
				camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
				camera.position.z = 3000;
				//创建一个新的场景对象。
				scene = new THREE.Scene();

				for (let i = 0; i < table.length; i++) {
					//创建dom元素
					let dom = document.createElement('div');
					dom.className = 'element';
					let img = document.createElement('img');
					img.src = table[i].url;
					dom.appendChild(img);

					let object = new THREE.CSS3DObject(dom);
					object.position.x = Math.random() * 4000 - 2000;
					object.position.y = Math.random() * 4000 - 2000;
					object.position.z = Math.random() * 4000 - 2000;
					scene.add(object);
					objects.push(object);
				}
				//三维向量
				let vector = new THREE.Vector3();
				//球坐标
				let spherical = new THREE.Spherical();

				for (let i = 0, l = objects.length; i < l; i++) {
					let phi = Math.acos(-1 + (2 * i) / l);
					let theta = Math.sqrt(l * Math.PI) * phi;
					//这是Three.js中大部分对象的基类，提供了一系列的属性和方法来对三维空间中的物体进行操纵。
					let object = new THREE.Object3D();
					spherical.set(800, phi, theta);
					object.position.setFromSpherical(spherical);
					vector.copy(object.position).multiplyScalar(2);
					object.lookAt(vector);
					targets.push(object);
				}
				//CSS3DRenderer用于通过CSS3的transform属性， 将层级的3D变换应用到DOM元素上
				renderer = new THREE.CSS3DRenderer();
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.domElement.style.position = 'absolute';
				document.getElementById('container').appendChild(renderer.domElement);
				// 鼠标控制
				controls = new THREE.TrackballControls(camera, renderer.domElement);
				controls.rotateSpeed = 0.5;//旋转的速度
				controls.minDistance = 500;//够将相机向内移动多少
				controls.maxDistance = 6000;//将相机向外移动多少
				controls.addEventListener('change', render);
				transform();
				//窗口大小变化事件
				window.addEventListener('resize', onWindowResize, false);
			}

			function transform() {
				let duration = 2000;
				TWEEN.removeAll();
				for (let i = 0; i < objects.length; i++) {
					let object = objects[i];
					let target = targets[i];

					new TWEEN.Tween(object.position)
						.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
						.easing(TWEEN.Easing.Exponential.InOut)
						.start();

					new TWEEN.Tween(object.rotation)
						.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
						.easing(TWEEN.Easing.Exponential.InOut)
						.start();
				}
				new TWEEN.Tween(this)
					.to({}, duration * 2)
					.onUpdate(render)
					.start();
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
				render();
			}

			//旋转动画
			function animate() {
				// 让场景通过x轴或者y轴旋转  & z
				// scene.rotation.x += 0.001;
				scene.rotation.y += 0.001;
				requestAnimationFrame(animate);
				TWEEN.update();
				controls.update();
				// 渲染循环
				render();
			}

			function render() {
				renderer.render(scene, camera);
			}

		</script>
		<style>
			html,
			body {
				height: 100%;
			}

			body {
				background-color: #000000;
				margin: 0;
				overflow: hidden;
			}

			.element {
				width: 140px;
				height: 140px;
				cursor: pointer;
				box-shadow: 0px 0px 12px rgba(238, 196, 11, 0.5);
				border: 2px solid #fff;
				text-align: center;
				cursor: default;
			}

			.element:hover {
				box-shadow: 0px 0px 12px rgba(11, 250, 250, 0.85);
				border: 2px solid rgba(127, 255, 255, 0.85);
			}

			.element img {
				width: 140px;
				height: 140px;
				cursor: pointer;
				object-fit: cover;
			}

			#music {
				display: none;
			}
		</style>
	</body>

</html>
